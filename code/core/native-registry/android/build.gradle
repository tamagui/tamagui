buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.9.0')}")
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

// nitrogen autolinking
apply from: "${project.projectDir}/../nitrogen/generated/android/tamaguiregistry+autolinking.gradle"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace = "com.tamagui.registry"
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)

        externalNativeBuild {
            cmake {
                cppFlags "-O2 -frtti -fexceptions -Wall -fstack-protector-all"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters(*(rootProject.getProperties().get("reactNativeArchitectures")?.split(",")
                    ?: ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"]))
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
    }

    packagingOptions {
        excludes = [
            "META-INF",
            "META-INF/**",
            "**/libjsi.so",
            "**/libreact_nativemodule_core.so",
        ]
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation project(':react-native-nitro-modules')
}
