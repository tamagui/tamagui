allprojects {
    // expo libraries declare custom buildconfig fields.
    plugins.withId('com.android.library') {
        android.buildFeatures.buildConfig = true
    }

    // detox and native dependencies package shared jni libraries. apply the
    // react native app's prefab packaging rules to library test apk variants too.
    afterEvaluate {
        if (it.hasProperty('android')) {
            android {
                packaging {
                    jniLibs {
                        pickFirsts += [
                            '**/libfbjni.so',
                            '**/libreactnative.so',
                            '**/libjsi.so',
                            '**/libc++_shared.so',
                        ]
                    }
                }
            }
        }
    }
}
