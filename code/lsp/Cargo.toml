[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tamagui/tamagui"

[workspace.dependencies]
arc-swap = "1.7"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# release profile for the shipped binary: this runs on every keystroke, so
# favour codegen quality over build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# benches need unwinding, so they get their own profile
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
