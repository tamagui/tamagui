name: Release

# github evaluates workflow_run from the default branch. keep this workflow on
# main as well as v3-beta so successful v3-beta CI can publish automatically.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish from main
        required: true
        default: canary
        type: choice
        options:
          - canary
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  beta:
    name: Publish v3 beta
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'v3-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # this job publishes a beta automatically every time Checks goes green on a
    # v3-beta push.
    #
    # it declares no environment. every package's trusted publisher on npmjs.com
    # pins repository + release.yml with the environment left unset, and github
    # adds an `environment` claim to the OIDC token whenever a job names one, so
    # leaving it off is what certainly matches. the previous npm-publish-beta
    # environment was removed while chasing the 404 below and was NOT its cause;
    # whether npm treats an unset environment as "any" was never established.
    #
    # re-adding one to get protection rules means checking that against all 166
    # npm configs first, and the stable job below names none either.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tested v3-beta source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Select latest v3-beta build
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin v3-beta
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/v3-beta)" ]]; then
            echo "A newer v3-beta commit exists; its Checks run will publish instead."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # deliberately no registry-url. it makes setup-node write an .npmrc holding
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and export
      # NODE_AUTH_TOKEN as the placeholder XXXXX-XXXXX-XXXXX-XXXXX, because no
      # real token exists here. npm then sends that placeholder, authenticates as
      # nobody, and the registry answers a PUT with 404 rather than 401 so it does
      # not reveal whether the package exists. that 404 is what stopped every beta
      # cut. a configured credential also pre-empts OIDC, so trusted publishing
      # never ran at all. registry.npmjs.org is npm's default, so nothing here
      # needed the setting.
      - name: Setup Node.js
        if: steps.candidate.outputs.release == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Setup Bun
        if: steps.candidate.outputs.release == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Install npm with trusted publishing support
        if: steps.candidate.outputs.release == 'true'
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        if: steps.candidate.outputs.release == 'true'
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        if: steps.candidate.outputs.release == 'true'
        id: beta-pw-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.candidate.outputs.release == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.beta-pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.candidate.outputs.release == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Publish tested source to the beta channel
        if: steps.candidate.outputs.release == 'true'
        env:
          BETA_VERSION: 3.0.0-beta.${{ github.run_number }}.${{ github.run_attempt }}
        run: >-
          bun scripts/release.ts
          --beta
          --version "$BETA_VERSION"
          --ci
          --dirty
          --skip-finish
          --skip-tests
          --skip-native-tests
          --skip-checks

  ensure-ci:
    name: Approve main release source
    if: github.event_name == 'workflow_dispatch' && inputs.release != 'canary'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    steps:
      # a canary is a throwaway version on its own dist-tag that nothing installs
      # unless asked for by name, so it is cuttable from any branch and does not
      # wait on a full CI run. requiring current main meant merging a change just
      # to test it. a stable release still needs both.
      - name: Require current main and successful full CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          WORKFLOW_FILE: checks.yaml
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$TARGET_SHA" == "$main_sha" ]]

          get_runs() {
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
              -f head_sha="$TARGET_SHA" -f per_page=20
          }

          wait_for_run() {
            local run_id="$1"
            for ((attempt = 1; attempt <= 40; attempt++)); do
              read -r status conclusion < <(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                  --jq '[.status, (.conclusion // "pending")] | @tsv'
              )
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]]
                return
              fi
              sleep 120
            done
            echo "Timed out waiting for CI run $run_id" >&2
            return 1
          }

          runs=$(get_runs)
          run_id=$(jq -r '.workflow_runs | sort_by(.created_at) | last | .id // empty' <<< "$runs")
          if [[ -n "$run_id" ]]; then
            status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<< "$runs")
            conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // "pending"' <<< "$runs")
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "Full CI already passed for $TARGET_SHA."
              exit 0
            fi
            if [[ "$status" != "completed" ]] && wait_for_run "$run_id"; then
              echo "Existing full CI passed for $TARGET_SHA."
              exit 0
            fi
          fi

          started=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -f ref=main

          run_id=''
          for ((attempt = 1; attempt <= 12; attempt++)); do
            sleep 10
            runs=$(get_runs)
            run_id=$(jq -r --arg started "$started" \
              '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $started)] | sort_by(.created_at) | last | .id // empty' \
              <<< "$runs")
            [[ -n "$run_id" ]] && break
          done
          [[ -n "$run_id" ]]
          wait_for_run "$run_id"

  prepare_stable:
    name: Merge stable version commit
    if: github.event_name == 'workflow_dispatch' && inputs.release != 'canary'
    needs: ensure-ci
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      base_ref: ${{ steps.source.outputs.base-ref }}
      merged_sha: ${{ steps.merge.outputs.merged-sha }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release source and select baseline
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]

          tag_ref=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          canary_ref=$(git log --grep='^canary' --format='%H' -1)
          if [[ -z "$tag_ref" ]]; then
            base_ref="$canary_ref"
          elif [[ -z "$canary_ref" ]]; then
            base_ref="$tag_ref"
          elif (( $(git log -1 --format=%ct "$canary_ref") > $(git log -1 --format=%ct "$tag_ref") )); then
            base_ref="$canary_ref"
          else
            base_ref="$tag_ref"
          fi
          [[ -n "$base_ref" ]]
          echo "base-ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release commit
        env:
          RELEASE_KIND: ${{ inputs.release }}
          RELEASE_BASE_REF: ${{ steps.source.outputs.base-ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bun scripts/release.ts "--$RELEASE_KIND" --ci --dirty --skip-publish --skip-push --skip-tests --skip-native-tests --skip-checks --skip-build

      - name: Read prepared version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./code/ui/tamagui/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run release PR through full CI and the merge queue
        id: merge
        # pushes made with github.token do not start workflows. the coordinator
        # dispatches Checks on the exact release commit before enqueueing the PR.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: bun scripts/release-github.ts

  publish_stable:
    name: Publish merged stable release
    if: github.event_name == 'workflow_dispatch' && inputs.release != 'canary'
    needs: prepare_stable
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout merged release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare_stable.outputs.merged_sha }}

      - name: Validate merged release source
        env:
          MERGED_SHA: ${{ needs.prepare_stable.outputs.merged_sha }}
          RELEASE_VERSION: ${{ needs.prepare_stable.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$MERGED_SHA" ]]
          git merge-base --is-ancestor "$MERGED_SHA" origin/main
          version=$(node -p "require('./code/ui/tamagui/package.json').version")
          [[ "$version" == "$RELEASE_VERSION" ]]

      # no registry-url, for the same reason as the beta job above
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build merged release source
        run: bun run build:force

      - name: Publish prepared version
        env:
          RELEASE_BASE_REF: ${{ needs.prepare_stable.outputs.base_ref }}
        run: bun scripts/release.ts --republish --ci --dirty --skip-finish

      - name: Push stable tag
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ needs.prepare_stable.outputs.merged_sha }}
          RELEASE_VERSION: ${{ needs.prepare_stable.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            git fetch --no-tags origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
            [[ "$(git rev-list -n 1 "v$RELEASE_VERSION")" == "$MERGED_SHA" ]]
          else
            git tag "v$RELEASE_VERSION" "$MERGED_SHA"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
            git push origin "v$RELEASE_VERSION"
          fi
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --verify-tag --generate-notes --title "v$RELEASE_VERSION"
          fi

  publish_canary:
    name: Publish canary
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'canary'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release baseline
        id: source
        shell: bash
        run: |
          set -euo pipefail
          tag_ref=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          canary_ref=$(git log --grep='^canary' --format='%H' -1)
          if [[ -z "$tag_ref" ]]; then
            base_ref="$canary_ref"
          elif [[ -z "$canary_ref" ]]; then
            base_ref="$tag_ref"
          elif (( $(git log -1 --format=%ct "$canary_ref") > $(git log -1 --format=%ct "$tag_ref") )); then
            base_ref="$canary_ref"
          else
            base_ref="$tag_ref"
          fi
          [[ -n "$base_ref" ]]
          echo "base-ref=$base_ref" >> "$GITHUB_OUTPUT"

      # no registry-url, for the same reason as the beta job above
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare canary version
        env:
          RELEASE_BASE_REF: ${{ steps.source.outputs.base-ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tamagui Release'
          git config user.email 'tamagui@users.noreply.github.com'
          bun scripts/release.ts --canary --ci --dirty --skip-publish --skip-push --skip-tests --skip-native-tests --skip-checks

      - name: Publish prepared version
        env:
          RELEASE_BASE_REF: ${{ steps.source.outputs.base-ref }}
        run: bun scripts/release.ts --republish --ci --dirty --skip-finish
