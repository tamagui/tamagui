name: Site

# builds code/tamagui.dev as a static site and serves it from the tamagui-dev
# cloudflare worker (code/tamagui.dev/wrangler.jsonc). a push to main
# deploys it; a pull request into main uploads a preview version under the
# alias pr-<number> and comments its url.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
  # wrangler's preview url shape: <alias>-<worker>.<account subdomain>.workers.dev
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-tamagui-dev.natewienert.workers.dev

jobs:
  site:
    # fork pull requests get no secrets, so they cannot upload a preview
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/actions/install
        with:
          workspace-focus: '@tamagui/dot-dev'

      - name: Build
        working-directory: code/tamagui.dev
        env:
          ONE_SERVER_URL: ${{ github.event_name == 'pull_request' && env.PREVIEW_URL || 'https://tamagui.dev' }}
        run: bun run build:static

      - name: Deploy
        if: github.event_name != 'pull_request'
        working-directory: code/tamagui.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Upload preview
        if: github.event_name == 'pull_request'
        working-directory: code/tamagui.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 versions upload --preview-alias "$PREVIEW_ALIAS"

      - name: Comment preview url
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Site preview: $PREVIEW_URL (commit ${HEAD_SHA::9})"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" ||
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
