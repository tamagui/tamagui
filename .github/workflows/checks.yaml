name: Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f0458c758321159672aaa72e7cee1943c976869
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm install --global npm@12.0.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers with diagnostics
        timeout-minutes: 3
        env:
          DEBUG: pw:install
        run: bunx playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: node --version && npm --version
      - name: Verify browser launches
        run: node -e "require('playwright').chromium.launch().then(async browser => { console.log(await browser.version()); await browser.close() })"
