name: Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['24.16.0', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f0458c758321159672aaa72e7cee1943c976869
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install browsers with diagnostics
        timeout-minutes: 3
        env:
          DEBUG: pw:install
        run: bunx playwright install --with-deps chromium
      - name: Verify browser launches
        run: node -e "require('playwright').chromium.launch().then(async browser => { console.log(await browser.version()); await browser.close() })"
