name: Registry

# the DRY shadcn registry is generated from the canonical tamagui skin source. this workflow
# enforces that (a) the checked-in registry artifacts are up to date, (b) the
# generated items are shadcn-valid, (c) the shipped copies never drift from that source,
# and (d) an installed item builds + interacts in a blank web AND a blank Expo
# app. see registry/README.md.

on:
  pull_request:
  push:
    paths-ignore:
      - 'assets/**'
      - '.vscode/**'
    branches:
      - main
      - v3
      - 'v3-*'

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: playwright-browser-cache-registry-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Playwright version
        id: pw-version
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium

      - name: Setup Bun
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: 'package.json'

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx -p @playwright/test@${{ steps.pw-version.outputs.version }} playwright install chromium
        timeout-minutes: 10

  # fast, no workspace build needed — pure source reads (the generator reads the
  # A1 state vocabulary from style-grammar's committed src/states.ts).
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/actions/install

      - name: Unit tests (derivation, drift transform, item build)
        run: bun run registry:test

      - name: Registry artifacts up to date
        run: bun run registry:check

      - name: Registry is shadcn-valid
        run: bun run registry:validate

      - name: Shipped copies match canonical skins (blank apps)
        run: bun ./scripts/generate-registry.ts drift --only-authorized --strict

      - name: Report held-consumer drift (non-fatal)
        run: bun ./scripts/generate-registry.ts drift || true

  web:
    needs: playwright-browsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/actions/install

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium

      # no `playwright install-deps` here: chromium's libraries are already on
      # the ubuntu-latest image, and the only thing the command adds is CJK,
      # Thai and Cyrillic fallback fonts nothing in this job renders. It also
      # runs a full apt-get update, which is the step that intermittently hangs
      # the runner. integration-tests still needs it for webkit.

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build the packages the blank web app consumes
        run: bun turbo run build --filter=tamagui --filter=@tamagui/config --filter=@tamagui/vite-plugin

      # re-install the item from the generated registry and prove the install
      # output equals the committed (drift-checked) copy — the install path,
      # exercised end to end.
      - name: Install registry item into blank web app
        run: |
          bun ./scripts/registry-install.ts button registry/ci/blank-web --registry registry/json
          git diff --exit-code registry/ci/blank-web/components

      - name: Build + interaction smoke (web)
        working-directory: registry/ci/blank-web
        run: bun run smoke
        timeout-minutes: 15

  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/actions/install

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build the packages the blank expo app consumes
        run: bun turbo run build --filter=tamagui --filter=@tamagui/config --filter=@tamagui/metro-plugin

      - name: Install registry item into blank expo app
        run: |
          bun ./scripts/registry-install.ts button registry/ci/blank-expo --registry registry/json
          git diff --exit-code registry/ci/blank-expo/components

      - name: Interaction smoke (native)
        working-directory: registry/ci/blank-expo
        run: bun run smoke
        timeout-minutes: 15

      - name: Build (expo export / Metro bundle)
        working-directory: registry/ci/blank-expo
        run: bun run build:app
        timeout-minutes: 20
